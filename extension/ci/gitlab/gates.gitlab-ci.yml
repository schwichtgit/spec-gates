# spec-gates CI boundary — include or merge into .gitlab-ci.yml
# (projected by /speckit.gates.ci gitlab)
gates:
  stage: test
  image: node:22-slim
  timeout: 20m
  interruptible: true
  variables:
    # Full history: the MR check walks base..head for protected changes.
    GIT_DEPTH: "0"
  before_script:
    # python3: the emoji rule of the message check needs it.
    - apt-get update -q && apt-get install -y -q jq shellcheck git python3
    # Lockfile-pinned linters keep CI on the versions local runs use (the
    # parity gate compares them); latest only when the repo pins nothing.
    - if [ -f package-lock.json ]; then npm ci; else npm install -g prettier markdownlint-cli2; fi
  script:
    - bash .specify/gates/verify.sh --boundary ci
    # A failure here means a BROKEN GATE (a canary violation was accepted),
    # not a dirty tree.
    - bash .specify/gates/canary.sh
    # MR title/description against the commit-message rules, and
    # Protected-Change declarations across the MR's commits. Skips itself
    # outside merge-request pipelines. Note: editing an MR title or
    # description does not start a pipeline; re-run it after such edits.
    # GitLab exposes the description from 16.7 and truncates long ones; then
    # pr-check fetches the full text from the API with GATES_GITLAB_TOKEN (a
    # masked CI/CD variable holding a read_api token) or CI_JOB_TOKEN. A
    # truncated description it cannot fetch fails the job; before 16.7
    # without a token only the title is checked (pr-check prints a notice).
    - bash .specify/gates/pr-check.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
