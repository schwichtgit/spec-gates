# spec-gates dogfoods its own enforcement: this workflow projects the gate
# runtime (exactly as /speckit.gates.init does in a real project) and runs it
# against this repo, then runs the test suites. Local green == CI green because
# both use the lockfile-pinned prettier / markdownlint-cli2 and the same
# verify.sh.
name: CI
on:
  pull_request:
    # `edited`: a title/description change re-runs the PR check.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
jobs:
  gates:
    runs-on: ubuntu-latest
    # checks: write lets the JUnit step publish the "unit test results"
    # check run.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the PR check walks base..head for protected changes.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install pinned linters (prettier, markdownlint-cli2)
        run: npm ci

      # shellcheck comes from the official upstream release at the version
      # pinned in .tool-versions, NOT from apt: ubuntu ships 0.9.0, which
      # reports findings 0.11.0 does not (SC2015), so an unpinned CI
      # disagrees with a green local run for reasons no diff explains. The
      # parity gate enforces the same pin on every boundary.
      - name: Install system tooling (jq, pinned shellcheck)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq
          SC_VERSION="$(awk '$1 == "shellcheck" { print $2 }' .tool-versions)"
          [ -n "$SC_VERSION" ] || { echo "::error::.tool-versions declares no shellcheck version"; exit 1; }
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SC_VERSION}/shellcheck-v${SC_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install -m 0755 "shellcheck-v${SC_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-v${SC_VERSION}"
          INSTALLED="$(shellcheck --version | awk '/^version:/ { print $2 }')"
          echo "shellcheck: pinned $SC_VERSION, installed $INSTALLED"
          [ "$INSTALLED" = "$SC_VERSION" ] || { echo "::error::shellcheck install drifted from the pin"; exit 1; }

      - name: Project the gate runtime
        run: |
          mkdir -p .specify/gates/lib
          cp extension/runtime/verify.sh extension/runtime/doctor.sh extension/runtime/canary.sh extension/runtime/contract.sh extension/runtime/constitution.sh extension/runtime/pr-check.sh .specify/gates/
          cp extension/runtime/lib/*.sh .specify/gates/lib/
          cp extension/runtime/policy.schema.json .specify/gates/

      - name: Run the gate on this repo (dogfood)
        run: bash .specify/gates/verify.sh --boundary ci

      - name: Prove the gate still blocks (canaries)
        run: bash .specify/gates/canary.sh

      - name: Check the pull request (text + protected changes)
        if: github.event_name == 'pull_request'
        env:
          GATES_PR_TITLE: ${{ github.event.pull_request.title }}
          GATES_PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .specify/gates/pr-check.sh

      - name: Run the test suites
        run: |
          mkdir -p test-results
          bash tests/run.sh 2>&1 | tee test-results/run.log

      # The suites print one PASS:/FAIL:/SKIP: line per case;
      # scripts/test-report.py turns the log into JUnit, which becomes the
      # "unit test results" check (per-test table) and the job summary. The
      # report job below posts the PR comment.
      - name: Build the JUnit report
        if: always()
        run: python3 scripts/test-report.py test-results/run.log --junit test-results/junit.xml

      - name: Publish unit test results (check run + job summary)
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: test-results/junit.xml
          check_name: unit test results
          detailed_summary: true
          include_passed: true
          comment: false
          job_summary: true

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  # Hooks run through their shebang (#!/bin/bash): on macOS that is the
  # stock bash 3.2 with BSD userland, which the ubuntu job above never
  # exercises. 0.3.4 shipped a validate-pr.sh only bash >= 4 could parse.
  macos-bash32:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every shipped and test script parses under /bin/bash 3.2
        run: |
          /bin/bash --version | head -n 1
          fail=0
          for f in $(git ls-files 'extension/runtime/*.sh' 'extension/runtime/hooks/git/*' 'extension/runtime/hooks/claude/*.sh' 'tests/*.sh' '.github/scripts/*.sh'); do
            /bin/bash -n "$f" || { echo "::error file=$f::does not parse under /bin/bash 3.2"; fail=1; }
          done
          exit "$fail"

      - name: Project the gate runtime
        run: |
          mkdir -p .specify/gates/lib
          cp extension/runtime/verify.sh extension/runtime/doctor.sh extension/runtime/canary.sh extension/runtime/contract.sh extension/runtime/constitution.sh extension/runtime/pr-check.sh .specify/gates/
          cp extension/runtime/lib/*.sh .specify/gates/lib/
          cp extension/runtime/policy.schema.json .specify/gates/

      # Stock macOS userland: /bin/bash 3.2 and BSD sed/awk/grep/date first
      # on PATH, so no Homebrew GNU tool can mask a portability bug.
      - name: Hook, PR-check, and package suites under the stock macOS shell
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          for suite in test-hooks test-pr-check test-package; do
            echo "=== $suite"
            /bin/bash "tests/$suite.sh"
          done

      - name: Agent- and git-boundary canaries under the stock macOS shell
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          /bin/bash .specify/gates/canary.sh --only bash,protect,prhook,secret,credential,protected,branding,pr

  # Line coverage of the shipped runtime (#98). Report only: the job never
  # fails on the number (continue-on-error also keeps a suite failure under
  # tracing from blocking the merge; the gates job is the one that gates).
  # kcov comes from Debian, so this runs in the same node:26-slim image the
  # container matrix uses. The per-file table lands in the job summary.
  coverage:
    runs-on: ubuntu-latest
    container: node:26-slim
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Install tooling (git before checkout, so tags come along)
        run: |
          apt-get update -q
          apt-get install -y -q git jq python3 shellcheck kcov

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust the checkout (the container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pinned linters (prettier, markdownlint-cli2)
        run: npm ci

      - name: Project the gate runtime
        run: |
          mkdir -p .specify/gates/lib
          cp extension/runtime/verify.sh extension/runtime/doctor.sh extension/runtime/canary.sh extension/runtime/contract.sh extension/runtime/constitution.sh extension/runtime/pr-check.sh extension/runtime/project.sh .specify/gates/
          cp extension/runtime/lib/*.sh .specify/gates/lib/
          cp extension/runtime/policy.schema.json .specify/gates/

      - name: Run the suite under kcov and report coverage
        run: bash scripts/coverage.sh coverage

      # The full kcov output (cobertura XML, HTML report, run log), for
      # reading the per-line report and for diagnosing the merge.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  # One sticky PR comment with the test table and the coverage headline,
  # updated in place on every push. Runs after both jobs, even when one
  # failed, so a red run is reported too. Same-repository PRs only: a fork's
  # token cannot comment.
  report:
    needs: [gates, coverage]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the test and coverage results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: results

      - name: Build the PR comment
        run: |
          if [ ! -f results/test-results/run.log ]; then
            printf '### unit test results: FAIL\n\nThe gates job produced no test log; see the workflow run.\n' >pr-comment.md
          else
            python3 scripts/test-report.py results/test-results/run.log \
              --comment pr-comment.md --coverage results/coverage/summary.txt
          fi

      - name: Post or update the sticky comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: unit-test-results
          path: pr-comment.md
