# spec-gates dogfoods its own enforcement: this workflow projects the gate
# runtime (exactly as /speckit.gates.init does in a real project) and runs it
# against this repo, then runs the test suites. Local green == CI green because
# both use the lockfile-pinned prettier / markdownlint-cli2 and the same
# verify.sh.
name: CI
on:
  pull_request:
    # `edited`: a title/description change re-runs the PR check.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the PR check walks base..head for protected changes.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install pinned linters (prettier, markdownlint-cli2)
        run: npm ci

      # shellcheck comes from the official upstream release at the version
      # pinned in .tool-versions, NOT from apt: ubuntu ships 0.9.0, which
      # reports findings 0.11.0 does not (SC2015), so an unpinned CI
      # disagrees with a green local run for reasons no diff explains. The
      # parity gate enforces the same pin on every boundary.
      - name: Install system tooling (jq, pinned shellcheck)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq
          SC_VERSION="$(awk '$1 == "shellcheck" { print $2 }' .tool-versions)"
          [ -n "$SC_VERSION" ] || { echo "::error::.tool-versions declares no shellcheck version"; exit 1; }
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SC_VERSION}/shellcheck-v${SC_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install -m 0755 "shellcheck-v${SC_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-v${SC_VERSION}"
          INSTALLED="$(shellcheck --version | awk '/^version:/ { print $2 }')"
          echo "shellcheck: pinned $SC_VERSION, installed $INSTALLED"
          [ "$INSTALLED" = "$SC_VERSION" ] || { echo "::error::shellcheck install drifted from the pin"; exit 1; }

      - name: Project the gate runtime
        run: |
          mkdir -p .specify/gates/lib
          cp extension/runtime/verify.sh extension/runtime/doctor.sh extension/runtime/canary.sh extension/runtime/contract.sh extension/runtime/constitution.sh extension/runtime/pr-check.sh .specify/gates/
          cp extension/runtime/lib/*.sh .specify/gates/lib/
          cp extension/runtime/policy.schema.json .specify/gates/

      - name: Run the gate on this repo (dogfood)
        run: bash .specify/gates/verify.sh --boundary ci

      - name: Prove the gate still blocks (canaries)
        run: bash .specify/gates/canary.sh

      - name: Check the pull request (text + protected changes)
        if: github.event_name == 'pull_request'
        env:
          GATES_PR_TITLE: ${{ github.event.pull_request.title }}
          GATES_PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .specify/gates/pr-check.sh

      - name: Run the test suites
        run: bash tests/run.sh
